<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Arabic PDFs ask for Microsoft fonts that are not on Linux. Without these
     rules fontconfig falls back to Noto Sans Arabic, which is noticeably wider,
     so text overflows when rendering our .docx to check it - and the overflow
     gets blamed on the converter. Map each requested face to the closest
     open-licensed Naskh installed in ~/.local/share/fonts/arabic. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Simplified Arabic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Amiri</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimplifiedArabic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Amiri</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Traditional Arabic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Scheherazade New</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TraditionalArabic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Scheherazade New</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Sakkal Majalla</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Amiri</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>AGA Arabesque</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Amiri</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arabic Transparent</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Amiri</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arabic Typesetting</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Lateef</string></edit>
  </match>
</fontconfig>
